services:
  - type: web
    name: yomite-parser
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://yomite.vercel.app
      - key: GITHUB_REPO
        value: jlfuertes14/Yomite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RELEASE_SYNC_SECRET
        sync: false
